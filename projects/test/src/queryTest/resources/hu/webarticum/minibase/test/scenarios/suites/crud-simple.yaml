description: Simple crud queries
datasetResource: ../datasets/single-table.yaml
initQueries:
  - USE library
cases:

  - name: insert
    description: Test results of insertion
    initQueries:
      - "INSERT INTO books (title, author, pub_year) VALUES ('Magic Mountain, The', 'Mann, Thomas', 1924)"
      - "INSERT INTO books (title, author, pub_year) VALUES ('Clockwork Orange, A', 'Burgess, Anthony', 1962)"
    query: "SELECT * FROM books ORDER BY id DESC LIMIT 3"
    expectedResult:
      - [ 27, "Clockwork Orange, A", "Burgess, Anthony", 1962 ]
      - [ 26, "Magic Mountain, The", "Mann, Thomas", 1924 ]
      - [ 25, "One Hundred Years of Solitude", "Garcia Márquez, Gabriel", 1967 ]
    columns:
      - { name: id, type: hu.webarticum.miniconnect.lang.LargeInteger }
      - { name: title, type: java.lang.String }
      - { name: author, type: java.lang.String }
      - { name: pub_year, type: hu.webarticum.miniconnect.lang.LargeInteger }

  - name: update
    description: Test results of insertion
    initQueries:
      - "UPDATE books SET title='Idiot, The', author='Dostoyevsky, Fyodor' WHERE id=11"
    query: "SELECT * FROM books WHERE id >= 10 ORDER BY id LIMIT 3"
    expectedResult:
      - [ 10, "Misérables, Les", "Hugo, Victor", 1862 ]
      - [ 11, "Idiot, The", "Dostoyevsky, Fyodor", 1869 ]
      - [ 12, "Twenty Thousand Leagues Under the Seas", "Verne, Jules", 1870 ]
    columns:
      - { name: id, type: hu.webarticum.miniconnect.lang.LargeInteger }
      - { name: title, type: java.lang.String }
      - { name: author, type: java.lang.String }
      - { name: pub_year, type: hu.webarticum.miniconnect.lang.LargeInteger }

  - name: delete
    description: Test results of deletion
    initQueries:
      - "DELETE FROM books WHERE id BETWEEN 3 AND 24"
    query: "SELECT * FROM books ORDER BY id"
    expectedResult:
      - [ 1, "Don Quixote", "Cervantes, Miguel de", 1605 ]
      - [ 2, "Gulliver's Travels", "Swift, Jonathan", 1726 ]
      - [ 25, "One Hundred Years of Solitude", "Garcia Márquez, Gabriel", 1967 ]
    columns:
      - { name: id, type: hu.webarticum.miniconnect.lang.LargeInteger }
      - { name: title, type: java.lang.String }
      - { name: author, type: java.lang.String }
      - { name: pub_year, type: hu.webarticum.miniconnect.lang.LargeInteger }

  - name: mixed
    description: Mixed CRUD operations
    initQueries:
      - "UPDATE books SET title='Idiot, The', author='Dostoyevsky, Fyodor' WHERE id=11"
      - "UPDATE books SET title='Black Narcissus', author='Godden, Rumer' WHERE id=19"
      - "INSERT INTO books (title, author, pub_year) VALUES('Journey by Moonlight', 'Szerb Antal', 1937)"
      - "INSERT INTO books (title, author, pub_year) VALUES('Man Without Qualities, The', 'Musil, Robert', 1943)"
      - "DELETE FROM books WHERE id<11"
      - "DELETE FROM books WHERE id=19"
      - "DELETE FROM books WHERE id=23"
      - "DELETE FROM books WHERE id=27"
      - "INSERT INTO books (title, author, pub_year) VALUES('Satantango', 'Krasznahorkai László', 1985)"
    query: "SELECT * FROM books ORDER BY id"
    expectedResult:
      - [ 11, "Idiot, The", "Dostoyevsky, Fyodor", 1869 ]
      - [ 12, "Twenty Thousand Leagues Under the Seas", "Verne, Jules", 1870 ]
      - [ 13, "Anna Karenina", "Tolstoy, Leo", 1877 ]
      - [ 14, "Brothers Karamazov, The", "Dostoyevsky, Fyodor", 1880 ]
      - [ 15, "Ulysses", "Joyce, James", 1922 ]
      - [ 16, "Trial, The", "Kafka, Franz", 1925 ]
      - [ 17, "All Quiet on the Western Front", "Remarque, Erich Maria", 1929 ]
      - [ 18, "Gone with the Wind", "Mitchell, Margaret", 1936 ]
      - [ 20, "Nineteen Eighty-Four", "Orwell, George", 1949 ]
      - [ 21, "Catcher in the Rye, The", "Salinger, Jerome David", 1951 ]
      - [ 22, "Fahrenheit 451", "Bradbury, Ray", 1953 ]
      - [ 24, "Doctor Zhivago", "Pasternak, Boris Leonidovich", 1957 ]
      - [ 25, "One Hundred Years of Solitude", "Garcia Márquez, Gabriel", 1967 ]
      - [ 26, "Journey by Moonlight", "Szerb Antal", 1937 ]
      - [ 28, "Satantango", "Krasznahorkai László", 1985 ]
    columns:
      - { name: id, type: hu.webarticum.miniconnect.lang.LargeInteger }
      - { name: title, type: java.lang.String }
      - { name: author, type: java.lang.String }
      - { name: pub_year, type: hu.webarticum.miniconnect.lang.LargeInteger }
