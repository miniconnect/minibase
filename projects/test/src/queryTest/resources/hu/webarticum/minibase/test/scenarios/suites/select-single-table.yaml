description: Simple table select queries
datasetResource: ../datasets/single-table.yaml
initQueries:
  - USE library
cases:

  - name: record-by-id
    description: Select single record by id
    query: "SELECT * FROM books WHERE id = 14"
    expectedResult:
      - [ 14, "Brothers Karamazov, The", "Dostoyevsky, Fyodor Mikhailovich", 1880 ]
    columns:
      - { name: id, type: hu.webarticum.miniconnect.lang.LargeInteger }
      - { name: title, type: java.lang.String }
      - { name: author, type: java.lang.String }
      - { name: pub_year, type: hu.webarticum.miniconnect.lang.LargeInteger }

  - name: columns-order-limit-1
    description: Select single constant
    query: "SELECT id, title FROM books ORDER BY pub_year DESC LIMIT 3"
    expectedResult:
      - [ 25, "One Hundred Years of Solitude" ]
      - [ 24, "Doctor Zhivago" ]
      - [ 23, "Lord of the Flies" ]
    columns:
      - { name: id, type: hu.webarticum.miniconnect.lang.LargeInteger }
      - { name: title, type: java.lang.String }

  - name: columns-order-limit-2
    description: Select single constant
    query: "SELECT id, author, title FROM books ORDER BY title LIMIT 5"
    expectedResult:
      - [ 17, "Remarque, Erich Maria", "All Quiet on the Western Front" ]
      - [ 13, "Tolstoy, Lev Nikolayevich", "Anna Karenina" ]
      - [ 14, "Dostoyevsky, Fyodor Mikhailovich", "Brothers Karamazov, The" ]
      - [ 21, "Salinger, Jerome David", "Catcher in the Rye, The" ]
      - [ 24, "Pasternak, Boris Leonidovich", "Doctor Zhivago" ]
    columns:
      - { name: id, type: hu.webarticum.miniconnect.lang.LargeInteger }
      - { name: author, type: java.lang.String }
      - { name: title, type: java.lang.String }

  - name: single-column-order-offset-limit
    description: Select single constant
    query: "SELECT author FROM books ORDER BY author OFFSET 4 LIMIT 5"
    expectedResult:
      - [ "Dickens, Charles" ]
      - [ "Dostoyevsky, Fyodor Mikhailovich" ]
      - [ "Flaubert, Gustave" ]
      - [ "Garcia Márquez, Gabriel" ]
      - [ "Golding, William" ]
    columns:
      - { name: author, type: java.lang.String }

  - name: with-expressions
    description: Select single constant
    query: |
      SELECT
        '#' || id AS `ID`,
        author || ': ' || UPPER(title) AS CAPTION,
        'published in ' || pub_year AS publish
      FROM books
      WHERE id BETWEEN 11 AND 15
      ORDER BY title DESC
    expectedResult:
      - [ "#11", "Tolstoy, Lev Nikolayevich: WAR AND PEACE", "published in 1869" ]
      - [ "#15", "Joyce, James: ULYSSES", "published in 1922" ]
      - [ "#12", "Verne, Jules: TWENTY THOUSAND LEAGUES UNDER THE SEAS", "published in 1870" ]
      - [ "#14", "Dostoyevsky, Fyodor Mikhailovich: BROTHERS KARAMAZOV, THE", "published in 1880" ]
      - [ "#13", "Tolstoy, Lev Nikolayevich: ANNA KARENINA", "published in 1877" ]
    columns:
      - { name: ID, type: java.lang.String }
      - { name: caption, type: java.lang.String }
      - { name: publish, type: java.lang.String }

  - name: count
    description: Select count of all records
    query: "SELECT COUNT(*) FROM books"
    expectedResult:
      - [ 25 ]
    columns:
      - { type: hu.webarticum.miniconnect.lang.LargeInteger }

  - name: count-filter
    description: Select count of records by filter
    query: "SELECT COUNT(*) FROM books WHERE pub_year>1870 AND author='Tolstoy, Lev Nikolayevich'"
    expectedResult:
      - [ 1 ]
    columns:
      - { type: hu.webarticum.miniconnect.lang.LargeInteger }

  - name: offset-only
    description: Select query with only an OFFSET clause
    query: "SELECT * FROM books OFFSET 23"
    expectedResult:
      - [ 24, "Doctor Zhivago", "Pasternak, Boris Leonidovich", 1957 ]
      - [ 25, "One Hundred Years of Solitude", "Garcia Márquez, Gabriel", 1967 ]
    columns:
      - { name: id, type: hu.webarticum.miniconnect.lang.LargeInteger }
      - { name: title, type: java.lang.String }
      - { name: author, type: java.lang.String }
      - { name: pub_year, type: hu.webarticum.miniconnect.lang.LargeInteger }

  - name: filter-by-variable
    description: More complex query demonstrating several features
    initQueries:
      - "SET @yr = 1950"
    query:
      SELECT title, pub_year FROM books WHERE pub_year > @yr
    expectedResult:
      - [ "Catcher in the Rye, The", 1951 ]
      - [ "Fahrenheit 451", 1953 ]
      - [ "Lord of the Flies", 1954 ]
      - [ "Doctor Zhivago", 1957 ]
      - [ "One Hundred Years of Solitude", 1967 ]
    ordered: false
    columns:
      - { name: title, type: java.lang.String, nullable: false }
      - { name: pub_year, type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }

  - name: complex-select
    description: More complex query demonstrating several features
    initQueries:
      - "SET @yr = 1967"
    query:
      SELECT
        CONCAT_WS(' ', 'lorem', null, 'ipsum', 'dolor') sit,
        CASE WHEN NULLIF(2 + 2, 2 * 2) IS NULL THEN '99' ELSE id END ESAC,
        title,
        NULLIF(pub_year, @yr) `pY`
      FROM books
      WHERE id>20
      ORDER BY author ASC
      OFFSET 1 LIMIT 2
    expectedResult:
      - [ "lorem ipsum dolor", 99, "One Hundred Years of Solitude", null ]
      - [ "lorem ipsum dolor", 99, "Lord of the Flies", 1954 ]
    columns:
      - { name: sit, type: java.lang.String, nullable: false }
      - { name: esac, type: java.math.BigDecimal, nullable: false }
      - { name: title, type: java.lang.String, nullable: false }
      - { name: pY, type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: true }
