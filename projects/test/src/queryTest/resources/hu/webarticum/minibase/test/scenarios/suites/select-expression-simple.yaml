description: Simple expression select queries
datasetResource: ../datasets/empty.yaml
cases:

  - name: abs
    description: Abs expression
    query: |
      SELECT
        ABS(0), ABS(-3), ABS(-23), ABS(-256), ABS(2), ABS(-9223372036854775808),
        ABS(-3.20), ABS(4.0210), ABS('9'), ABS('-1234'), ABS(NULL)
    expectedResult:
      - [ 0, 3, 23, 256, 2, 9223372036854775808, "3.20", "4.0210", 9, 1234, null ]
    columns:
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: java.math.BigDecimal, nullable: false }
      - { type: java.math.BigDecimal, nullable: false }
      - { type: java.math.BigDecimal, nullable: false }
      - { type: java.math.BigDecimal, nullable: false }
      - { type: java.lang.Void, nullable: true }

  - name: add
    description: Add expression
    query: |
      SELECT
        0 + 0, 1 + 1, 7 + 4, 7 + 12, -2 + 2, -3 + 10, 30 + -1, -10 + -72,
        4 + 2.0, 7 + -1.2, 34123.02310 + 1203.201, 1253752056703516253601011 + 152, 2 + '7', '12.030' + 4, '5' + '6',
        INTERVAL 'P2DT3H' + INTERVAL 'P1DT20M', DATETIME('2025-12-20 03:40:17') + INTERVAL 'P1DT20M',
        DATE('2025-11-01') + TIME('12:30:00'), DATETIME('2025-12-20 03:40:17') + UTCOFFSET('+01:00'),
        NULL + 3, 2 + NULL, NULL + NULL
    expectedResult:
      - [ 0, 2, 11, 19, 0, 7, 29, -82, "6.0", "5.8", "35326.22410", 1253752056703516253601163, 9, "16.030", 11,
          "P3DT3H20M", "2025-12-21 04:00:17", "2025-11-01 12:30:00", "2025-12-20T03:40:17+01:00", null, null, null ]
    columns:
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
      - { type: hu.webarticum.miniconnect.lang.LargeInteger, nullable: false }
