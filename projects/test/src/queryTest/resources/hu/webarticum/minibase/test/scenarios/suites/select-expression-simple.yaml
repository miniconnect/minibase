  - name: bit-length
    description: BitLength expression
    query: |
      SELECT
        BIT_LENGTH(b''), BIT_LENGTH(b'000'), BIT_LENGTH(b'10111010'),
        BIT_LENGTH('10'), BIT_LENGTH('lorem'), BIT_LENGTH('tűz'), BIT_LENGTH(14), BIT_LENGTH(260), BIT_LENGTH(NULL)
    expectedResult:
      - [ 0, 3, 8, 16, 40, 32, 4, 9, null ]
    columns:
